name: CI
on:
  pull_request:        # pushes to main are built and published by the "Beta" workflow
  workflow_dispatch:   # lets you press "Run workflow" by hand in the Actions tab

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Build first and keep the exe, so you get a program even if a test fails.
      - name: Build
        run: cargo build --release

      - name: Keep the exe (download it from the run page, under "Artifacts")
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-manager-windows-exe
          path: target/release/android-emulator-manager.exe
          if-no-files-found: error

      - name: Tests
        run: cargo test
