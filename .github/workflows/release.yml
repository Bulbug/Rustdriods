name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release name, e.g. v0.7.1 (leave empty to only build the exe without a release)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Check that the exe exists
        shell: pwsh
        run: |
          Get-ChildItem target/release/*.exe | Format-Table Name, Length
          if (-not (Test-Path target/release/android-emulator-manager.exe)) { throw "The exe was not built" }

      - name: Work out the version name
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" } else { $v = "${{ github.event.inputs.version }}" }
          if (-not $v) { $v = "dev-${{ github.run_number }}" }
          "name=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish=" + (("${{ github.ref_type }}" -eq "tag") -or ("${{ github.event.inputs.version }}" -ne "")) | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package
        shell: pwsh
        run: |
          $name = "android-emulator-manager-${{ steps.ver.outputs.name }}-windows-x64"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/android-emulator-manager.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "$name.zip"
          Copy-Item target/release/android-emulator-manager.exe "$name.exe"
          Get-FileHash "$name.zip", "$name.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-ChildItem android-emulator-manager-*.*, SHA256SUMS.txt | Format-Table Name, Length

      # Always keep the files on the run page, even if publishing the release fails.
      - name: Keep the files (run page, under "Artifacts")
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-manager-release-files
          path: |
            android-emulator-manager-*.zip
            android-emulator-manager-*.exe
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish the GitHub release
        if: steps.ver.outputs.publish == 'True'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          files: |
            android-emulator-manager-*.zip
            android-emulator-manager-*.exe
            SHA256SUMS.txt
